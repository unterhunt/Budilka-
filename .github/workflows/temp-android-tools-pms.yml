name: Temp Android Tools PMS

on:
  pull_request:
    branches:
      - main

jobs:
  package-tools:
    runs-on: ubuntu-latest
    steps:
      - name: Download Android command line tools
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/android-sdk/cmdline-tools"
          curl -fL --retry 4 -o "$RUNNER_TEMP/cmdline-tools.zip" \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$RUNNER_TEMP/android-sdk/cmdline-tools"
          mv "$RUNNER_TEMP/android-sdk/cmdline-tools/cmdline-tools" "$RUNNER_TEMP/android-sdk/cmdline-tools/latest"
          yes | "$RUNNER_TEMP/android-sdk/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$RUNNER_TEMP/android-sdk/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"
          rm -rf "$RUNNER_TEMP/android-sdk/.temp" "$RUNNER_TEMP/android-sdk/licenses"
          cd "$RUNNER_TEMP"
          zip -qr android-sdk-pms.zip android-sdk
      - name: Upload Android SDK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-sdk-pms
          path: ${{ runner.temp }}/android-sdk-pms.zip
          retention-days: 1
