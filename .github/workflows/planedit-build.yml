name: Build PlanEdit Mobile APK

on:
  push:
    branches: [ planedit-mobile-build ]
    paths:
      - '.github/workflows/planedit-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore PlanEdit project
        shell: bash
        run: |
          cat > /tmp/planedit.zip.b64 <<'EOF'

EOF
          base64 -d /tmp/planedit.zip.b64 > /tmp/planedit.zip
          unzip -q /tmp/planedit.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: yes | sdkmanager --licenses >/dev/null || true; sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Build APK
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle -p PlanEditMobile assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PlanEdit-Mobile-debug
          path: PlanEditMobile/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
