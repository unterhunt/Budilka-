name: PlanEdit PR APK Build

on:
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore project from embedded archive
        shell: bash
        run: |
          awk '/^UEsDB/{flag=1} flag{print} /^UEsFBg/{flag=0}' .github/workflows/planedit-build.yml | tr -d '\n' | base64 -d > /tmp/planedit.zip
          unzip -q /tmp/planedit.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: yes | sdkmanager --licenses >/dev/null || true; sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle -p PlanEditMobile assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: PlanEdit-Mobile-debug
          path: PlanEditMobile/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
