name: Build Elektro-Meister V2 APK

on:
  push:
    branches: ["agent/elektromeister-v2"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/elektromeister-v2

      - name: Restore and verify project
        shell: bash
        run: |
          set -euxo pipefail
          cat .github/elektromeister-v2-bin/part00 \
              .github/elektromeister-v2-bin/part01 \
              .github/elektromeister-v2-bin/part02 \
              .github/elektromeister-v2-bin/part03-04 \
              .github/elektromeister-v2-bin/part05-06 \
              .github/elektromeister-v2-bin/part07-08 > /tmp/ElektroMeisterV2.zip
          test "$(wc -c < /tmp/ElektroMeisterV2.zip)" -eq 25760
          echo "29d7c6f6f10a169d1c178edaca61f07c110bb9e7b4a095391ed1c7c23d85d2a3  /tmp/ElektroMeisterV2.zip" | sha256sum -c -
          unzip -tqq /tmp/ElektroMeisterV2.zip
          unzip -q /tmp/ElektroMeisterV2.zip -d /tmp/elektromeister-src

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" >/dev/null

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build signed APK
        id: android_build
        continue-on-error: true
        shell: bash
        working-directory: /tmp/elektromeister-src/ElektroMeisterV2_clean
        run: |
          set +e
          gradle assembleDebug --no-daemon > /tmp/elektromeister-build.log 2>&1
          status=$?
          echo "$status" > /tmp/elektromeister-build-status.txt
          exit "$status"

      - name: Upload compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Elektro-Meister-v2-compiler-log
          path: |
            /tmp/elektromeister-build.log
            /tmp/elektromeister-build-status.txt

      - name: Prepare APK
        if: steps.android_build.outcome == 'success'
        run: cp /tmp/elektromeister-src/ElektroMeisterV2_clean/app/build/outputs/apk/debug/app-debug.apk Elektro-Meister-v2.apk

      - name: Upload APK
        if: steps.android_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Elektro-Meister-v2-APK
          path: Elektro-Meister-v2.apk
