name: Publish PlanEdit Mobile APK

on:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/planedit-publish.yml' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record workflow run
        shell: bash
        run: |
          mkdir -p releases
          echo "${GITHUB_RUN_ID}" > releases/planedit_run_id.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/planedit_run_id.txt
          git commit -m "Record PlanEdit build run ${GITHUB_RUN_ID}" || true
          git push

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Restore PlanEdit source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, re
          text = Path('.github/workflows/planedit-build.yml').read_text()
          match = re.search(r"echo '([A-Za-z0-9+/=]+)' \\| base64 -d > planedit.zip", text)
          if not match:
              raise SystemExit('Embedded PlanEdit source was not found')
          Path('planedit.zip').write_bytes(base64.b64decode(match.group(1)))
          PY
          unzip -q -o planedit.zip

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: PlanEditMobile
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare APK
        shell: bash
        run: |
          cp PlanEditMobile/app/build/outputs/apk/debug/app-debug.apk releases/PlanEditMobile-v0.1.0.apk
          sha256sum releases/PlanEditMobile-v0.1.0.apk > releases/planedit_sha256.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlanEditMobile-v0.1.0-apk
          path: releases/PlanEditMobile-v0.1.0.apk
          if-no-files-found: error

      - name: Publish APK to repository
        shell: bash
        run: |
          git add releases/PlanEditMobile-v0.1.0.apk releases/planedit_sha256.txt
          git commit -m "Publish PlanEdit Mobile APK run ${GITHUB_RUN_ID}"
          git push
