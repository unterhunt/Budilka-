name: Build Elektro-Meister V2.1 APK

on:
  push:
    branches: ["agent/elektromeister-v2"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/elektromeister-v2

      - name: Restore and verify project
        shell: bash
        run: |
          set -euxo pipefail
          cat .github/elektromeister-v2-bin/part00 \
              .github/elektromeister-v2-bin/part01 \
              .github/elektromeister-v2-bin/part02 \
              .github/elektromeister-v2-bin/part03 \
              .github/elektromeister-v2-bin/part04 \
              .github/elektromeister-v2-bin/part05a \
              .github/elektromeister-v2-bin/part05b \
              .github/elektromeister-v2-bin/part05c > /tmp/ElektroMeisterV2.zip
          test "$(wc -c < /tmp/ElektroMeisterV2.zip)" -eq 25774
          echo "32bfa4e702ebbf76b3a139cd7a328770ce0f77a5222bfa03ced1cfe459638701  /tmp/ElektroMeisterV2.zip" | sha256sum -c -
          unzip -tqq /tmp/ElektroMeisterV2.zip
          unzip -q /tmp/ElektroMeisterV2.zip -d /tmp/elektromeister-src
          python3 .github/elektromeister-v2/patch_cables.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" >/dev/null

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build signed APK
        working-directory: /tmp/elektromeister-src/ElektroMeisterV2_clean
        run: gradle assembleDebug --no-daemon

      - name: Prepare APK
        run: cp /tmp/elektromeister-src/ElektroMeisterV2_clean/app/build/outputs/apk/debug/app-debug.apk Elektro-Meister-v2.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Elektro-Meister-v2.1-APK
          path: Elektro-Meister-v2.1.apk
