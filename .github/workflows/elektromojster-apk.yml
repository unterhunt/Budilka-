name: Build Elektro Mojster APK

on:
  push:
    branches: ["agent/elektromojster-apk"]
    paths:
      - ".github/workflows/elektromojster-apk.yml"
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4
        with:
          ref: agent/elektromojster-apk

      - name: Restore and verify project
        shell: bash
        run: |
          set -euxo pipefail
          cat \
            .github/elektromojster/project.b64.00 \
            .github/elektromojster/project.b64.01 \
            .github/elektromojster/project.b64.02 \
            .github/elektromojster/project.b64.03 \
            .github/elektromojster/project.b64.04a \
            .github/elektromojster/project.b64.04b \
            .github/elektromojster/project.b64.04c \
            .github/elektromojster/project.b64.04d1 \
            .github/elektromojster/project.b64.04d2 \
            .github/elektromojster/project.b64.05 \
            | tr -d '\r\n ' > /tmp/project.b64
          echo "343475012e4deea9267996edd25fa1a262f3df615727968b3f96b652d4b5f237  /tmp/project.b64" | sha256sum -c -
          base64 --decode /tmp/project.b64 > /tmp/ElektroMojster.zip
          echo "b4f0d1d296e50d25071184c87ab995760c5734d98923da47d473f79c3a29e1ca  /tmp/ElektroMojster.zip" | sha256sum -c -
          mkdir -p /tmp/elektromojster-src
          unzip -q /tmp/ElektroMojster.zip -d /tmp/elektromojster-src

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build signed debug APK
        working-directory: /tmp/elektromojster-src/ElektroMojster
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        shell: bash
        run: |
          cp /tmp/elektromojster-src/ElektroMojster/app/build/outputs/apk/debug/app-debug.apk ElektroMojster.apk
          sha256sum ElektroMojster.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ElektroMojster-APK
          path: ElektroMojster.apk
          if-no-files-found: error
